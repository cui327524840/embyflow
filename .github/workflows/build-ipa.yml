name: 构建未签名 IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译 EmbyFlow.ipa
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 15（保留 iOS 14.5 部署目标支持）
        run: |
          ls /Applications | grep -i '^Xcode' || true
          for v in 15.4 15.3 15.2 15.1 15.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              break
            fi
          done
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          # 新版 XcodeGen 会写 objectVersion 77（Xcode 16 的项目格式），
          # Xcode 15 打不开；这里降成 56，Xcode 14/15/16 都能读。
          perl -pi -e 's/objectVersion = \d+;/objectVersion = 56;/g; s/compatibilityVersion = "Xcode 1[456]\.0";/compatibilityVersion = "Xcode 14.0";/g' EmbyFlow.xcodeproj/project.pbxproj
          grep -m1 'objectVersion' EmbyFlow.xcodeproj/project.pbxproj

      - name: Release 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project EmbyFlow.xcodeproj \
            -scheme EmbyFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/EmbyFlow.app"
          test -d "$APP"
          echo "▸ Info.plist 检查"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry EmbyFlow.ipa Payload
          rm -rf Payload
          ls -lh EmbyFlow.ipa
          shasum -a 256 EmbyFlow.ipa | tee checksum.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: EmbyFlow-ipa
          path: |
            EmbyFlow.ipa
            checksum.txt
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" EmbyFlow.ipa checksum.txt \
            --title "EmbyFlow ${GITHUB_REF_NAME}" \
            --notes "未签名 IPA，用巨魔（TrollStore）安装：下载 EmbyFlow.ipa → 传到 iPhone（隔空投送 / 文件 App）→ 用巨魔打开安装。支持 iOS 14.5+，iPhone 6s 全程 H.264 硬解。"
